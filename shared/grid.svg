<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <g stroke="#fff" fill="none">
    <!-- minor lines every 32 px -->
    <path stroke-opacity=".32" stroke-width="1" d="M32.5 0V160M64.5 0V160M96.5 0V160M128.5 0V160M0 32.5H160M0 64.5H160M0 96.5H160M0 128.5H160"/>
    <!-- major lines on the tile edge -->
    <path stroke-opacity=".75" stroke-width="1" d="M.5 0V160M0 .5H160"/>
    <!-- a small cross where major lines meet -->
    <path stroke-opacity="1" stroke-width="1.4" d="M.5 -6V7M-6 .5H7M160.5 -6V7M154 .5H160M.5 154V160M-6 160.5H7M160.5 154V160M154 160.5H160"/>
  </g>
  <!-- a dot in the middle of each major cell -->
  <circle cx="80.5" cy="80.5" r="1.1" fill="#fff"/>
</svg>
